<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apprena - Fournitures Scolaires</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header style="background-color: #0f172a; color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center;">
        <div>
            <h1 style="margin:0; font-size: 1.5rem;">Apprena 🎒</h1>
            <p style="margin:5px 0 0 0; font-size: 0.9rem;">Vos fournitures scolaires en un clic ou un appel</p>
        </div>
        <button id="cart-btn" style="background: #007bff; color: white; border: none; padding: 10px 15px; border-radius: 8px;">Panier (0)</button>
    </header>

    <main class="product-grid" id="products-container">
        <!-- Produits générés dynamiquement -->
    </main>

    <script>
        async function fetchProducts() {
            const res = await fetch('/api/products');
            const products = await res.json();
            const container = document.getElementById('products-container');
            
            if (products.length === 0) {
                container.innerHTML = "<p style='padding: 20px;'>Aucun produit disponible pour le moment.</p>";
                return;
            }

            container.innerHTML = products.map(p => `
                <div class="product-card">
                    <div class="product-image-container">
                        <img src="${p.image_url}" alt="${p.name}">
                    </div>
                    <div class="product-details">
                        <div class="product-title">${p.name}</div>
                        <div class="product-price">${p.price} FCFA</div>
                        <button class="btn-add-cart">+ Ajouter au panier</button>
                    </div>
                </div>
            `).join('');
        }
        fetchProducts();
    </script>
</body>
</html>
